name: Mise a jour des prix

on:
  schedule:
    # tcgcsv.com se met a jour vers 20:00 UTC, on passe un peu apres
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Chaque jeu est independant: si l'un echoue, les autres sont quand meme publies
      - name: One Piece (TCGplayer)
        continue-on-error: true
        run: node collector/build-prices.mjs

      - name: Pokemon (TCGdex, en francais)
        continue-on-error: true
        run: node collector/pokemon.mjs

      - name: Publier les fichiers modifies
        if: always()
        run: |
          git config user.name "card-data-bot"
          git config user.email "card-data-bot@users.noreply.github.com"
          git add data library
          git diff --cached --quiet || (git commit -m "Donnees du $(date -u +%F)" && git push)
